name: Apply v0.18.5 live parser hardening

on:
  push:
    branches: [v0185-structural-scope]
    paths:
      - '.github/workflows/apply-v0185.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0185-structural-scope
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v0.18.5 fixes
        run: python3 tools/apply_v0185.py
      - name: Validate generated source
        run: |
          node --check parser.js
          node --check storage.js
          node --check background.js
          node --check dashboard.js
          npm test
      - name: Commit durable implementation and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_v0185.py .github/workflows/apply-v0185.yml
          git add -A
          git commit -m 'Implement v0.18.5 structural history scope and bound return identity [v0185-generated]'
          git push origin HEAD:v0185-structural-scope
