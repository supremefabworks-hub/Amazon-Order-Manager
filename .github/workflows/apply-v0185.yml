name: Apply v0.18.5 live parser hardening

on:
  push:
    branches: [v0185-structural-scope]
    paths:
      - '.github/workflows/apply-v0185.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0185-structural-scope
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Namespace v0.18.5 test fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_v0185.py')
          text = p.read_text(encoding='utf-8')
          replacements = {
            'function fakeNode(': 'function v185FakeNode(',
            'function productAnchor(': 'function v185ProductAnchor(',
            'fakeNode(': 'v185FakeNode(',
            'productAnchor(': 'v185ProductAnchor(',
            'liveCancelledId': 'v185LiveCancelledId',
            'cancelledProduct': 'v185CancelledProduct',
            'cancelledCardText': 'v185CancelledCardText',
            'cancelledCardNode': 'v185CancelledCardNode',
            'cancelledOrderNumberNode': 'v185CancelledOrderNumberNode',
            'neighboringAncestor': 'v185NeighboringAncestor',
            'structuralDoc': 'v185StructuralDoc',
            'isolatedCancelled': 'v185IsolatedCancelled',
            'isolatedTerminal': 'v185IsolatedTerminal',
            'unrelatedAnchor': 'v185UnrelatedAnchor',
            'broadReturnBox': 'v185BroadReturnBox',
            'broadEntries': 'v185BroadEntries',
            'strongReturnAnchor': 'v185StrongReturnAnchor',
            'strongReturnItem': 'v185StrongReturnItem',
            'strongEntries': 'v185StrongEntries'
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Apply v0.18.5 fixes
        run: python3 tools/apply_v0185.py
      - name: Validate generated source
        run: |
          node --check parser.js
          node --check storage.js
          node --check background.js
          node --check dashboard.js
          npm test
      - name: Commit durable implementation and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_v0185.py .github/workflows/apply-v0185.yml
          git add -A
          git commit -m 'Implement v0.18.5 structural history scope and bound return identity [v0185-generated]'
          git push origin HEAD:v0185-structural-scope
