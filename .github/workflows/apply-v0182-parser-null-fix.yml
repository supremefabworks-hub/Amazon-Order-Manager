name: Apply v0.18.2 unknown refund parser fix

on:
  push:
    branches: [v0182-multireturn-updater-reliability]
    paths:
      - tools/apply_v0182_parser_null_fix.py
      - .github/workflows/apply-v0182-parser-null-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0182-multireturn-updater-reliability
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply parser null fix
        run: python3 tools/apply_v0182_parser_null_fix.py
      - name: Run full regression suite
        run: |
          node --check parser.js
          npm test
      - name: Commit durable fix and remove temporary machinery
        shell: bash
        run: |
          rm -f tools/apply_v0182_parser_null_fix.py .github/workflows/apply-v0182-parser-null-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep unknown return refund amounts null [v0182-null-fix]"
          git push origin HEAD:v0182-multireturn-updater-reliability
