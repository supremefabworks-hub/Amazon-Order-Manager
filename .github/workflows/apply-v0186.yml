name: Apply v0.18.6 end-of-year pagination boundary

on:
  push:
    branches: [v0186-end-of-year-pagination]
    paths:
      - '.github/workflows/apply-v0186.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0186-end-of-year-pagination
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v0.18.6 fixes
        run: python3 tools/apply_v0186.py
      - name: Validate generated source
        run: |
          node --check parser.js
          node --check background.js
          npm test
      - name: Commit durable implementation and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_v0186.py .github/workflows/apply-v0186.yml
          git add -A
          git commit -m 'Implement v0.18.6 end-of-year pagination boundary [v0186-generated]'
          git push origin HEAD:v0186-end-of-year-pagination
