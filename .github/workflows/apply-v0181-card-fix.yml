name: Apply v0.18.1 card payment parser fix

on:
  push:
    branches: [v0181-card-payment-evidence]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v0181-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0181-card-payment-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply parser fix
        run: python scripts/apply-v0181-card-fix.py
      - name: Validate parser and focused regression
        run: |
          node --check parser.js
          node payment-evidence-test.js
      - name: Commit generated source and remove temporary patch machinery
        shell: bash
        run: |
          rm scripts/apply-v0181-card-fix.py .github/workflows/apply-v0181-card-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix strict payment card evidence parsing [v0181-generated]"
          git push origin HEAD:v0181-card-payment-evidence
