name: Apply v0.18.1 payment scope hardening

on:
  push:
    branches: [v0181-card-payment-evidence]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v0181-scope-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0181-card-payment-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply payment scope fix
        run: python scripts/apply-v0181-payment-scope-fix.py
      - name: Validate parser and payment regressions
        run: |
          node --check parser.js
          node parser-test.js
          node payment-evidence-test.js
      - name: Commit durable source and remove temporary machinery
        shell: bash
        run: |
          rm scripts/apply-v0181-payment-scope-fix.py .github/workflows/apply-v0181-payment-scope-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require payment-scoped DOM evidence [v0181-scope-generated]"
          git push origin HEAD:v0181-card-payment-evidence
