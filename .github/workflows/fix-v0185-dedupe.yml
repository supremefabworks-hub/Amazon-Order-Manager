name: Validate v0.18.5 return item dedupe

on:
  push:
    branches: [v0185-structural-scope]
    paths:
      - '.github/workflows/fix-v0185-dedupe.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0185-structural-scope
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply dedupe hardening
        run: python3 tools/fix_v0185_dedupe.py
      - name: Validate
        run: |
          node --check parser.js
          npm test
      - name: Commit durable change and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/fix_v0185_dedupe.py .github/workflows/fix-v0185-dedupe.yml
          git add -A
          git commit -m 'Harden v0.18.5 return item duplicate collapse [v0185-dedupe]'
          git push origin HEAD:v0185-structural-scope
