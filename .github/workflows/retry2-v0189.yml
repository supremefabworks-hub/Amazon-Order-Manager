name: Finalize v0.18.9 evidence contract

on:
  push:
    branches: [v0189-complete-ledger-and-filters]
    paths:
      - '.github/workflows/retry2-v0189.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0189-complete-ledger-and-filters
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Align generator with current CSV exporter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_v0189.py')
          s=p.read_text(encoding='utf-8')
          old="d=once(d,\"    for (const row of buildRows()) lines.push([row.statusLabel,row.orderId,row.itemNames.join(' | '),row.orderTotal ?? '',row.refundAmount ?? '',row.cardLast4 || '',row.amazonStatus,row.detailComplete,row.openUrl,row.lastScannedAt || ''].map(csvCell).join(','));\",\"    for (const row of buildRows().filter(row => row.dataComplete)) lines.push([row.statusLabel,row.orderId,row.itemNames.join(' | '),row.orderTotal ?? '',row.refundAmount ?? '',row.cardLast4 || '',row.amazonStatus,row.detailComplete,row.openUrl,row.lastScannedAt || ''].map(csvCell).join(','));\",'csv complete rows')"
          new="d=once(d,\"    for (const row of buildRows()) {\",\"    for (const row of buildRows().filter(row => row.dataComplete)) {\",'csv complete rows')"
          if old not in s: raise SystemExit('old CSV generator patch not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply v0.18.9 fixes
        run: python3 tools/apply_v0189.py
      - name: Align legacy v0.18.8 checkmark fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('parser-test.js')
          s=p.read_text(encoding='utf-8')
          old="""const v0188Timeline = { innerText:v0188BrevilleText, textContent:v0188BrevilleText, querySelectorAll(selector){ return selector.includes('milestone_checkmark') ? [{},{},{}] : []; } };\nconst v0188Dom = p.extractCompletedReturnMilestonesFromDom(v0188Timeline);\nassert(v0188Dom.started && v0188Dom.shipped && v0188Dom.received, 'three milestone checkmarks must complete first three Amazon stages');\nassert(!v0188Dom.refundIssued && !v0188Dom.credited, 'future unchecked Refund issued/credited labels must stay incomplete');"""
          new="""const v0188Rows = ['Initiated','Dropped off','Return received'].map(label => ({ innerText:label, textContent:label, parentElement:null, getAttribute(){ return null; } }));\nconst v0188Checks = v0188Rows.map(row => ({ parentElement:row, getAttribute(){ return null; } }));\nconst v0188Timeline = { innerText:v0188BrevilleText, textContent:v0188BrevilleText, querySelectorAll(selector){ return selector.includes('milestone_checkmark') ? v0188Checks : []; }, getAttribute(){ return null; }, parentElement:null };\nconst v0188Dom = p.extractCompletedReturnMilestonesFromDom(v0188Timeline);\nassert(v0188Dom.started && v0188Dom.shipped && v0188Dom.received, 'three structurally bound milestone checkmarks must complete first three Amazon stages');\nassert(!v0188Dom.refundIssued && !v0188Dom.credited, 'future unchecked Refund issued/credited labels must stay incomplete');"""
          if old not in s: raise SystemExit('legacy v0.18.8 fixture not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate generated source
        run: |
          node --check parser.js
          node --check content.js
          node --check background.js
          node --check dashboard.js
          npm test
      - name: Commit durable implementation and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_v0189.py .github/workflows/apply-v0189.yml .github/workflows/retry-v0189.yml .github/workflows/retry2-v0189.yml
          git add -A
          git commit -m 'Implement v0.18.9 complete-only ledger and authoritative return progress [v0189-generated]'
          git push origin HEAD:v0189-complete-ledger-and-filters
