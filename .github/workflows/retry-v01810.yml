name: Retry v0.18.10 dashboard cleanup

on:
  push:
    branches: [v01810-combine-complete-stats]
    paths:
      - '.github/workflows/retry-v01810.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v01810-combine-complete-stats
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Align legacy Processing-tab regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_v01810.py')
          s=p.read_text(encoding='utf-8')
          marker="u = read('ui-test.js')\n"
          patch="u = once(u, \"assert(dashboardHtmlV0189.includes('data-view=\\\"processing\\\"') && dashboardHtmlV0189.includes('data-view=\\\"errors\\\"'), 'dashboard must separate Processing and Errors from completed orders');\", \"assert(!dashboardHtmlV0189.includes('data-view=\\\"processing\\\"') && dashboardHtmlV0189.includes('data-view=\\\"errors\\\"'), 'Processing must remain internal while Errors remains user-facing');\", 'legacy processing tab regression')\n"
          if marker not in s: raise SystemExit('ui-test marker not found')
          p.write_text(s.replace(marker, marker+patch, 1), encoding='utf-8')
          PY
      - name: Apply v0.18.10 UI cleanup
        run: python3 tools/apply_v01810.py
      - name: Validate generated source
        run: |
          node --check dashboard.js
          npm test
      - name: Commit durable implementation and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_v01810.py .github/workflows/apply-v01810.yml .github/workflows/retry-v01810.yml
          git add -A
          git commit -m 'Implement v0.18.10 simplified dashboard views [v01810-generated]'
          git push origin HEAD:v01810-combine-complete-stats
