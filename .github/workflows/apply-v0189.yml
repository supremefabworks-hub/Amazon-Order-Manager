name: Apply v0.18.9 complete-ledger and authoritative-return fixes

on:
  push:
    branches: [v0189-complete-ledger-and-filters]
    paths:
      - '.github/workflows/apply-v0189.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0189-complete-ledger-and-filters
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v0.18.9 fixes
        run: python3 tools/apply_v0189.py
      - name: Validate generated source
        run: |
          node --check parser.js
          node --check content.js
          node --check background.js
          node --check dashboard.js
          npm test
      - name: Commit durable implementation and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_v0189.py .github/workflows/apply-v0189.yml
          git add -A
          git commit -m 'Implement v0.18.9 complete-only ledger and authoritative return progress [v0189-generated]'
          git push origin HEAD:v0189-complete-ledger-and-filters
