name: Harden v0.18.13 reset-refresh cleanup v2

on:
  push:
    branches: [v01813-reset-refresh-version]
    paths:
      - '.github/workflows/harden2-v01813.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v01813-reset-refresh-version
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply cleanup hardening
        run: python3 tools/harden_v01813.py
      - name: Validate hardened candidate
        run: |
          node --check background.js
          node --check dashboard.js
          npm test
      - name: Commit hardening and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/harden_v01813.py .github/workflows/harden-v01813.yml .github/workflows/harden2-v01813.yml
          git add -A
          git commit -m 'Harden v0.18.13 reset-refresh tab cleanup [v01813-hardening]'
          git push origin HEAD:v01813-reset-refresh-version
