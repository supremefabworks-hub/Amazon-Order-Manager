name: Apply v0.17 implementation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v017.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v017-issue7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply release-review hardening
        run: python3 .github/scripts/hotfix_v017_review.py
      - name: Run full regression suite
        run: npm test
      - name: Commit hardened candidate to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add parser.js background.js parser-test.js state-machine-test.js
          git status --short
          git commit -m 'Harden v0.17 payment scope and upgrade reset'
          git push origin HEAD:v017-issue7
