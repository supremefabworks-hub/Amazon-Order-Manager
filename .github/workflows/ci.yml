name: Test and package extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check source snapshot
        id: source
        shell: bash
        run: |
          if [[ -f background.js && -f parser.js && -f storage.js && -f content.js ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Source files have not been imported into the repository yet. See PROJECT_HANDOFF.md."
          fi
      - name: Run regression tests
        if: steps.source.outputs.ready == 'true'
        run: npm test
      - name: Build installable ZIP
        if: steps.source.outputs.ready == 'true'
        run: |
          mkdir -p dist/amazon-order-manager
          cp manifest.json background.js content.js parser.js storage.js dashboard.html dashboard.js popup.html popup.js ui.css workflow-recorder.js BANK_RECONCILIATION_PROMPT.txt BANK_RECONCILIATION_SCHEMA.json README.md dist/amazon-order-manager/
          cd dist
          zip -r amazon-order-manager.zip amazon-order-manager
      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.ready == 'true'
        with:
          name: amazon-order-manager-${{ github.sha }}
          path: dist/amazon-order-manager.zip
