name: Apply v0.18.1 durable docs

on:
  push:
    branches: [v0181-card-payment-evidence]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v0181-docs-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0181-card-payment-evidence
          fetch-depth: 0
      - name: Apply documentation updates
        run: python scripts/apply-v0181-docs.py
      - name: Remove temporary generation files and commit
        shell: bash
        run: |
          rm scripts/apply-v0181-docs.py .github/workflows/apply-v0181-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document v0.18.1 payment evidence fix [v0181-docs-generated]"
          git push origin HEAD:v0181-card-payment-evidence
