name: Retry v0.18.13 reset-refresh and version UI

on:
  push:
    branches: [v01813-reset-refresh-version]
    paths:
      - '.github/workflows/retry-v01813.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v01813-reset-refresh-version
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v0.18.13 recovery/version changes
        run: python3 tools/apply_v01813.py
      - name: Update legacy four-action regression and layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ui-test.js')
          s=p.read_text(encoding='utf-8')
          old="for (const label of ['Details</button>', 'Credit</button>', 'Reset</button>', 'Refresh</button>']) assert(dashboard.includes(label), `dashboard must render fixed ${label.split('<')[0]} action`);\nassert(dashboard.includes(\"type: 'ARL_REFRESH_ORDER'\"), 'Refresh button must request background-tab refresh');\nassert(background.includes('async function forceRefreshOrder'), 'background worker must implement rendered forced refresh');"
          new="for (const label of ['Details</button>', 'Credit</button>', 'Reset & Refresh</button>']) assert(dashboard.includes(label), `dashboard must render fixed ${label.split('<')[0]} action`);\nassert(dashboard.includes(\"type: 'ARL_RESET_REFRESH_ORDER'\"), 'Reset & Refresh must request the authoritative rebuild path');\nassert(background.includes('async function forceResetRefreshOrder'), 'background worker must implement authoritative reset-and-refresh recovery');"
          if old not in s: raise SystemExit('legacy action regression block not found')
          s=s.replace(old,new,1)
          s=s.replace("assert(css.includes('grid-template-columns: repeat(4, minmax(0, 1fr))'), 'actions must stay side-by-side in four fixed columns');", "assert(css.includes('grid-template-columns: repeat(3, minmax(0, 1fr))'), 'actions must stay side-by-side in three fixed columns');", 1)
          p.write_text(s,encoding='utf-8')

          c=Path('ui.css')
          css=c.read_text(encoding='utf-8')
          oldcss='grid-template-columns: repeat(4, minmax(0, 1fr));'
          if oldcss not in css: raise SystemExit('four-column action grid not found')
          c.write_text(css.replace(oldcss, 'grid-template-columns: repeat(3, minmax(0, 1fr));', 1), encoding='utf-8')
          PY
      - name: Validate generated source
        run: |
          node --check background.js
          node --check dashboard.js
          npm test
      - name: Commit durable implementation and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_v01813.py .github/workflows/apply-v01813.yml .github/workflows/retry-v01813.yml
          git add -A
          git commit -m 'Implement v0.18.13 combined reset-refresh and live version [v01813-generated]'
          git push origin HEAD:v01813-reset-refresh-version
