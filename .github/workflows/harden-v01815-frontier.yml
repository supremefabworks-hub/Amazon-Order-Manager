name: Harden v0.18.15 deepest frontier retention

on:
  push:
    branches: [v01815-newest-session-refresh]
    paths:
      - '.github/workflows/harden-v01815-frontier.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v01815-newest-session-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Harden deepest historical frontier retention
        run: python3 tools/harden_v01815_frontier.py
      - name: Validate hardened candidate
        run: |
          node --check background.js
          npm test
      - name: Commit hardening and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/harden_v01815_frontier.py .github/workflows/harden-v01815-frontier.yml
          git add -A
          git commit -m 'Harden v0.18.15 deepest frontier retention [v01815-frontier]'
          git push origin HEAD:v01815-newest-session-refresh
