name: Apply v0.18.8 Amazon bank lifecycle separation

on:
  push:
    branches: [v0188-amazon-bank-stage-separation]
    paths:
      - '.github/workflows/apply-v0188.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0188-amazon-bank-stage-separation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v0.18.8 fixes
        run: python3 tools/apply_v0188.py
      - name: Validate generated source
        run: |
          node --check parser.js
          node --check storage.js
          node --check dashboard.js
          npm test
      - name: Commit durable implementation and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_v0188.py .github/workflows/apply-v0188.yml
          git add -A
          git commit -m 'Implement v0.18.8 Amazon lifecycle and bank separation [v0188-generated]'
          git push origin HEAD:v0188-amazon-bank-stage-separation
