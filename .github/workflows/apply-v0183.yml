name: Apply v0.18.3 live acceptance fixes

on:
  push:
    branches: [v0183-live-acceptance-fixes]
    paths:
      - '.github/workflows/apply-v0183.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0183-live-acceptance-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Correct generator replacement boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_v0183.py')
          text = p.read_text(encoding='utf-8')
          replacements = [
              (
                  "out, count = re.subn(pattern, replacement, text, count=1, flags=re.S)",
                  "out, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)"
              ),
              (
                  'r"  function extractStatusText\\(text\\) \\{.*?\\n  \\}\\n\\n  function parseTextRecord"',
                  'r"  function extractStatusText\\(text\\) \\{.*?\\n  \\}\\n\\n  function inferPageType"'
              ),
              (
                  'status_fn + "\\n  function parseTextRecord"',
                  'status_fn + "\\n  function inferPageType"'
              )
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'generator source fragment not found: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Apply v0.18.3 fixes
        run: python3 tools/apply_v0183.py
      - name: Complete legacy Order Details classification coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('parser.js')
          text = p.read_text(encoding='utf-8')
          replacements = [
              (
                  "    if (/order-history|your-orders|yourorders|order-details|orderdetails|order-detail/.test(u)) return 'order';",
                  "    if (/order-history|your-orders|yourorders|order-details|orderdetails|order-detail|\\/gp\\/css\\/summary\\/edit\\.html/.test(u)) return 'order';"
              ),
              (
                  "    if (/\\/your-orders\\/order-details|\\/gp\\/your-account\\/order-details|orderdetails|order-detail/.test(u)) return false;",
                  "    if (/\\/your-orders\\/order-details|\\/gp\\/your-account\\/order-details|\\/gp\\/css\\/summary\\/edit\\.html|orderdetails|order-detail/.test(u)) return false;"
              ),
              (
                  "      return href.includes(orderId) && (/(?:\\/your-orders\\/order-details|order-details|orderdetails)/i.test(href) || /view\\s+order\\s+details/i.test(text));",
                  "      return href.includes(orderId) && (/(?:\\/your-orders\\/order-details|\\/gp\\/your-account\\/order-details|\\/gp\\/css\\/summary\\/edit\\.html|order-details|orderdetails)/i.test(href) || /view\\s+order\\s+details/i.test(text));"
              )
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'parser legacy classification fragment not found: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate generated source
        run: |
          node --check parser.js
          node --check storage.js
          node --check dashboard.js
          node --check content.js
          node --check background.js
          npm test
      - name: Commit durable implementation and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/apply_v0183.py .github/workflows/apply-v0183.yml
          git add -A
          git commit -m 'Implement v0.18.3 live Amazon acceptance fixes [v0183-generated]'
          git push origin HEAD:v0183-live-acceptance-fixes
