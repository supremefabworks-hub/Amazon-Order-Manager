name: Apply v0.18.2 review hardening

on:
  push:
    branches: [v0182-multireturn-updater-reliability]
    paths:
      - tools/apply_v0182_review_fixes.py
      - .github/workflows/apply-v0182-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0182-multireturn-updater-reliability
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply review fixes
        run: python3 tools/apply_v0182_review_fixes.py
      - name: Validate all regressions
        run: |
          node --check parser.js
          node --check dev-updater.js
          node --check popup.js
          npm test
      - name: Commit durable fixes and remove temporary machinery
        shell: bash
        run: |
          rm -f tools/apply_v0182_review_fixes.py .github/workflows/apply-v0182-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden v0.18.2 canonical refunds and Windows diagnostics [v0182-review]"
          git push origin HEAD:v0182-multireturn-updater-reliability
