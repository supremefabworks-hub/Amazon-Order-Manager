name: Apply v0.18.4 terminal cancelled-order handling

on:
  push:
    branches: [v0184-terminal-cancelled-orders]
    paths:
      - '.github/workflows/apply-v0184.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0184-terminal-cancelled-orders
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Correct generator popup matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_v0184.py')
          text = p.read_text(encoding='utf-8')
          old = 'pop = once(pop, "`${crawl.currentPageCompleted || 0}/${pageOrders || \'?\'} order details", "`${crawl.currentPageCompleted || 0}/${pageOrders || \'?\'} orders complete", \'popup terminal-aware checkpoint label\')'
          new = 'pop = once(pop, "${crawl.currentPageCompleted || 0}/${pageOrders || \'?\'} order details", "${crawl.currentPageCompleted || 0}/${pageOrders || \'?\'} orders complete", \'popup terminal-aware checkpoint label\')'
          if old not in text:
              raise SystemExit('popup matcher source line not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply v0.18.4 fixes
        run: python3 tools/apply_v0184.py
      - name: Validate generated source
        run: |
          node --check parser.js
          node --check background.js
          node --check dashboard.js
          node --check popup.js
          npm test
      - name: Commit durable implementation and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_v0184.py .github/workflows/apply-v0184.yml
          git add -A
          git commit -m 'Implement v0.18.4 terminal cancelled-order handling [v0184-generated]'
          git push origin HEAD:v0184-terminal-cancelled-orders
