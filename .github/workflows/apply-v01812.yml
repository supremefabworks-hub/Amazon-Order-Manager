name: Apply v0.18.12 adaptive pacing

on:
  push:
    branches: [v01812-smart-fast-pacing]
    paths:
      - '.github/workflows/apply-v01812.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v01812-smart-fast-pacing
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v0.18.12 adaptive pacing
        run: python3 tools/apply_v01812.py
      - name: Validate generated source
        run: |
          node --check background.js
          node --check content.js
          npm test
      - name: Commit durable implementation and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_v01812.py .github/workflows/apply-v01812.yml
          git add -A
          git commit -m 'Implement v0.18.12 adaptive smart-fast serial pacing [v01812-generated]'
          git push origin HEAD:v01812-smart-fast-pacing
