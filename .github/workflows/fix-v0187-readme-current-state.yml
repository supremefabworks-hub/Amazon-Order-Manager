name: Correct v0.18.7 current-state README
on:
  push:
    branches: [v0187-item-status-and-milestones]
    paths:
      - '.github/workflows/fix-v0187-readme-current-state.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0187-item-status-and-milestones
      - name: Correct current source-of-truth references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          t = p.read_text(encoding='utf-8')
          replacements = {
            '**Current source baseline: v0.18.7 candidate for Issue #19.**': '**Current source baseline: v0.18.7 candidate for Issue #25.**',
            '''Two issues remain intentionally separate:\n\n- **#7 — live Amazon Business acceptance** for the authoritative v0.17 crawler/return behavior that remains unchanged in v0.18.\n- **#10 — verified development auto-update pipeline** for the v0.18 local update workflow. Its code/test scope is implemented, but the one-time Windows bootstrap and one subsequent automatic update must be live-validated before the issue closes.''': '''Current live acceptance trackers:\n\n- **#7 — live Amazon Business acceptance** for the authoritative crawler/return behavior.\n- **#23 — final-page year rollover acceptance** proving a disabled `Next` ends the current year and starts the next older year.\n- **#25 — v0.18.7 acceptance** for evidence-safe return milestones, faster serial crawl pacing, and per-product order status.\n\nUpdater Issue **#10 is closed** after unattended live update from v0.18.3 to v0.18.4 succeeded on the second Windows PC.''',
            '2. Read Issues #7 and #10 and any newer issue that supersedes either scope.': '2. Read Issues #7, #23, and #25 and any newer issue that supersedes their scope.',
            '4. Root v0.18.5 is the active candidate for the terminal-cancelled-order live fix. The archived v0.16.0 ZIP is recovery material only.': '4. Root v0.18.7 is the active candidate. The archived v0.16.0 ZIP is recovery material only.',
            'A later strictly newer release must update unattended from the repaired v0.18.2 installation before Issue #10 can close.': 'Issue #10 is closed: the repaired channel later completed an unattended v0.18.3 -> v0.18.4 update on the second Windows PC without reinstalling or manually reloading the extension.',
            'This release is also the unattended updater proof from repaired v0.18.2. Do not manually replace `current` or press Reload when `dev-v0.18.3` publishes.': 'The updater path introduced here was later proven live by an unattended v0.18.3 -> v0.18.4 update on the second Windows PC.'
          }
          for old, new in replacements.items():
            if old not in t:
              raise SystemExit(f'missing README anchor: {old[:80]}')
            t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          PY
      - name: Validate docs and release tests
        run: npm test
      - name: Commit durable docs and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fix-v0187-readme-current-state.yml
          git add README.md
          git commit -m 'Correct v0.18.7 current-state README references [v0187-docs]'
          git push origin HEAD:v0187-item-status-and-milestones
