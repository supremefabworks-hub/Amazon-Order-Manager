name: Retry v0.18.14 ledger recovery hardening

on:
  push:
    branches: [v01814-durable-resume-autostart]
    paths:
      - '.github/workflows/retry-harden2-v01814.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v01814-durable-resume-autostart
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply ledger recovery hardening
        run: python3 tools/harden2_v01814.py
      - name: Update in-flight resume regression
        run: python3 tools/patch_harden2_v01814_test.py
      - name: Validate hardened candidate
        run: |
          node --check background.js
          npm test
      - name: Commit hardening and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/harden2_v01814.py tools/patch_harden2_v01814_test.py .github/workflows/harden2-v01814.yml .github/workflows/retry-harden2-v01814.yml
          git add -A
          git commit -m 'Harden v0.18.14 ledger-backed resume recovery [v01814-hardening2]'
          git push origin HEAD:v01814-durable-resume-autostart
