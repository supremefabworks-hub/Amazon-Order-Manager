name: Apply v0.18.14 durable resume and Auto-start

on:
  push:
    branches: [v01814-durable-resume-autostart]
    paths:
      - '.github/workflows/apply-v01814.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v01814-durable-resume-autostart
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v0.18.14 durable resume and Auto-start
        run: python3 tools/apply_v01814.py
      - name: Validate generated source
        run: |
          node --check background.js
          node --check content.js
          node --check dashboard.js
          node --check storage.js
          npm test
      - name: Commit durable implementation and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_v01814.py .github/workflows/apply-v01814.yml
          git add -A
          git commit -m 'Implement v0.18.14 durable resume and Amazon Auto-start [v01814-generated]'
          git push origin HEAD:v01814-durable-resume-autostart
