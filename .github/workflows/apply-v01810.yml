name: Apply v0.18.10 dashboard cleanup

on:
  push:
    branches: [v01810-combine-complete-stats]
    paths:
      - '.github/workflows/apply-v01810.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v01810-combine-complete-stats
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v0.18.10 UI cleanup
        run: python3 tools/apply_v01810.py
      - name: Validate generated source
        run: |
          node --check dashboard.js
          npm test
      - name: Commit durable implementation and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_v01810.py .github/workflows/apply-v01810.yml
          git add -A
          git commit -m 'Implement v0.18.10 consolidated dashboard metrics [v01810-generated]'
          git push origin HEAD:v01810-combine-complete-stats
