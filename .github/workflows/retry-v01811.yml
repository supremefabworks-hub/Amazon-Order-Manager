name: Retry v0.18.11 replacement workflows

on:
  push:
    branches: [v01811-replacement-workflows]
    paths:
      - '.github/workflows/retry-v01811.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v01811-replacement-workflows
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add direct Amazon replacement labels to generator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_v01811.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("['delivered', /(?:replacement (?:has been|was|is) delivered|replacement delivered)/i]", "['delivered', /(?:replacement (?:has been|was|is) delivered|replacement delivered)/i]")
          old="['ordered', /(?:replacement (?:has been|was|is) ordered|replacement order (?:has been|was) placed|replacement approved)/i]"
          new="['ordered', /(?:replacement (?:has been|was|is) ordered|replacement ordered|replacement order (?:has been|was) placed|replacement approved)/i]"
          if old not in s: raise SystemExit('ordered replacement rule not found')
          s=s.replace(old,new,1)
          old2="['requested', /(?:replacement (?:has been|was|is) requested|replacement request (?:is )?(?:confirmed|approved)|we(?:'|’)ll send (?:you )?a replacement|we will send (?:you )?a replacement|replacement (?:is )?being prepared|replacement arriving)/i]"
          new2="['requested', /(?:replacement (?:has been|was|is) requested|replacement requested|replacement request (?:is )?(?:confirmed|approved)|we(?:'|’)ll send (?:you )?a replacement|we will send (?:you )?a replacement|replacement (?:is )?being prepared|replacement arriving)/i]"
          if old2 not in s: raise SystemExit('requested replacement rule not found')
          p.write_text(s.replace(old2,new2,1),encoding='utf-8')
          PY
      - name: Apply v0.18.11 replacement workflow model
        run: python3 tools/apply_v01811.py
      - name: Validate generated source
        run: |
          node --check parser.js
          node --check storage.js
          node --check item-model.js
          node --check dashboard.js
          npm test
      - name: Commit durable implementation and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_v01811.py .github/workflows/apply-v01811.yml .github/workflows/retry-v01811.yml
          git add -A
          git commit -m 'Implement v0.18.11 replacement workflow separation [v01811-generated]'
          git push origin HEAD:v01811-replacement-workflows
