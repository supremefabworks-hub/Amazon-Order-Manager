name: Apply v0.18.15 newest-session refresh

on:
  push:
    branches: [v01815-newest-session-refresh]
    paths:
      - '.github/workflows/apply-v01815.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v01815-newest-session-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v0.18.15 newest-session behavior
        run: python3 tools/apply_v01815.py
      - name: Validate generated source
        run: |
          node --check background.js
          node --check dashboard.js
          node --check popup.js
          npm test
      - name: Commit durable implementation and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_v01815.py .github/workflows/apply-v01815.yml
          git add -A
          git commit -m 'Implement v0.18.15 newest-first scan sessions [v01815-generated]'
          git push origin HEAD:v01815-newest-session-refresh
