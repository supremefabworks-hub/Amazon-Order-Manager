name: Apply v0.18.2 durable documentation

on:
  push:
    branches: [v0182-multireturn-updater-reliability]
    paths:
      - tools/apply_v0182_docs.py
      - .github/workflows/apply-v0182-docs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0182-multireturn-updater-reliability
      - name: Apply durable docs
        run: python3 tools/apply_v0182_docs.py
      - name: Validate documented version references
        shell: bash
        run: |
          grep -q 'v0.18.2' README.md
          grep -q 'PR #16' PROJECT_HANDOFF.md
          grep -q 'multi-return-test.js' TESTING.md
          grep -q 'Issue #10' NEW_CHAT_PROMPT.md
      - name: Commit docs and remove temporary machinery
        shell: bash
        run: |
          rm -f tools/apply_v0182_docs.py .github/workflows/apply-v0182-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document v0.18.2 multi-return and updater repair [v0182-docs]"
          git push origin HEAD:v0182-multireturn-updater-reliability
