name: Finalize v0.18.13 recovery wording

on:
  push:
    branches: [v01813-reset-refresh-version]
    paths:
      - '.github/workflows/finalize-v01813.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v01813-reset-refresh-version
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Align Errors-view recovery wording
        run: python3 -c "from pathlib import Path; p=Path('dashboard.js'); s=p.read_text(encoding='utf-8'); old='Use Refresh to retry this order after the underlying Amazon issue is resolved.'; assert s.count(old)==1; p.write_text(s.replace(old, 'Use Reset & Refresh to retry this order after the underlying Amazon issue is resolved.', 1), encoding='utf-8')"
      - name: Validate final candidate
        run: |
          node --check background.js
          node --check dashboard.js
          npm test
      - name: Commit final candidate and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/finalize-v01813.yml
          git add -A
          git commit -m 'Finalize v0.18.13 combined recovery UI [v01813-final]'
          git push origin HEAD:v01813-reset-refresh-version
