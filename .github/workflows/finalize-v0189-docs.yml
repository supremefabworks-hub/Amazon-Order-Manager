name: Finalize v0.18.9 source-of-truth references

on:
  push:
    branches: [v0189-complete-ledger-and-filters]
    paths:
      - '.github/workflows/finalize-v0189-docs.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0189-complete-ledger-and-filters
      - name: Correct current-state README references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('**Current source baseline: v0.18.8 candidate for Issue #27.**', '**Current source baseline: v0.18.9 candidate for Issue #29.**', 1)
          s=s.replace('- **#25 — v0.18.7 acceptance** for evidence-safe return milestones, faster serial crawl pacing, and per-product order status.\n', '- **#25 — v0.18.7 acceptance** for faster serial crawl pacing and per-product order status.\n- **#29 — v0.18.9 acceptance** for authoritative return progress, complete-only ledger views, Processing/Errors isolation, and sort/filter/search. Issue #29 supersedes #27 for the remaining lifecycle defect.\n', 1)
          s=s.replace('2. Read Issues #7, #23, and #25 and any newer issue that supersedes their scope.', '2. Read Issues #7, #23, #25, and #29 and any newer issue that supersedes their scope.', 1)
          s=s.replace('4. Root v0.18.7 is the active candidate.', '4. Root v0.18.9 is the active candidate.', 1)
          s=s.replace('Views remain `All orders`, `Returns`, and `Needs review`, with no horizontally scrollable order containers.', 'Completed-data views are `All orders`, `Returns`, and `Needs review`; incomplete work is isolated in `Processing` and terminal per-order failures in `Errors`. No order container may scroll horizontally.', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit docs and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/finalize-v0189-docs.yml
          git add README.md
          git commit -m 'Correct v0.18.9 current-state source-of-truth references [v0189-docs]'
          git push origin HEAD:v0189-complete-ledger-and-filters
